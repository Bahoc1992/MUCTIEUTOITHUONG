<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
  <title>Danh sách bài hát | Tải file Word & phân trang</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #3e2c1c 0%, #5a3e2b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif;
      padding: 10px;
      margin: 0;
      transition: padding 0.3s ease;
    }

    .app-container {
      width: 100%;
      max-width: 1000px;
      background: #faf3e8;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 2px 8px rgba(255, 255, 200, 0.6);
      padding: 20px 15px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #d4b68a;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Nút danh sách bài hát */
    .song-list-toggle {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: #6b4c3b;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #4a3328, 0 5px 10px rgba(0,0,0,0.3);
      transition: all 0.2s;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .song-list-toggle:hover {
      background: #7d5a45;
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #4a3328, 0 8px 15px rgba(0,0,0,0.3);
    }

    .song-list-toggle:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #4a3328, 0 3px 8px rgba(0,0,0,0.3);
    }

    .song-list-toggle .badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #e74c3c;
      color: white;
      font-size: 0.7rem;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Dropdown danh sách */
    .song-list-dropdown {
      position: absolute;
      top: 65px;
      left: 20px;
      background: #fff9ef;
      border: 2px solid #d4b68a;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      z-index: 99;
      width: 350px;
      max-width: 85vw;
      max-height: 450px;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .song-list-dropdown.show {
      display: flex;
    }

    .song-list-header {
      padding: 12px 15px;
      background: #efe0cc;
      border-bottom: 2px solid #d4b68a;
      font-weight: 700;
      color: #3a2c18;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Be Vietnam Pro', sans-serif;
      flex-shrink: 0;
    }

    .song-list-header .sort-info {
      font-size: 0.7rem;
      color: #6b4c3b;
      font-style: italic;
      font-weight: 400;
    }

    .song-list-search {
      padding: 8px 12px;
      border-bottom: 1px solid #e0d0b8;
      flex-shrink: 0;
    }

    .song-list-search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #c8a87c;
      border-radius: 20px;
      font-size: 0.85rem;
      outline: none;
      background: #fffcf5;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .song-list-search input:focus {
      border-color: #8b6d4b;
      box-shadow: 0 0 5px rgba(139, 109, 75, 0.3);
    }

    .song-list-items {
      overflow-y: auto;
      max-height: 350px;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    .song-list-item {
      padding: 10px 15px;
      cursor: pointer;
      border-bottom: 1px solid #f0e8d8;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #3a2c18;
    }

    .song-list-item:hover {
      background: #f5efe0;
    }

    .song-list-item.active {
      background: #e8d5b0;
      font-weight: 700;
    }

    .song-list-item .song-order {
      background: #6b4c3b;
      color: white;
      min-width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Be Vietnam Pro', sans-serif;
      flex-shrink: 0;
    }

    .song-list-item .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-list-item .song-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      font-family: 'Noto Serif', 'Georgia', serif;
    }

    .song-list-item .song-preview {
      font-size: 0.7rem;
      color: #8b7355;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .song-list-item .song-page-number {
      background: #efe0cc;
      color: #3a2c18;
      min-width: 32px;
      height: 28px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Be Vietnam Pro', sans-serif;
      flex-shrink: 0;
      padding: 0 8px;
      white-space: nowrap;
    }

    .song-list-empty {
      padding: 20px;
      text-align: center;
      color: #ac8e6a;
      font-style: italic;
      font-size: 0.85rem;
    }

    .song-list-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 98;
    }

    .song-list-overlay.show {
      display: block;
    }

    /* === CÁC PHẦN TỬ ẨN KHI FULLSCREEN === */
    .app-header {
      width: 100%;
      text-align: center;
      transition: all 0.3s ease;
    }

    .app-header h1 {
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-weight: 600;
      color: #4b2e1a;
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 rgba(230, 200, 140, 0.4);
      font-family: 'Noto Serif', 'Georgia', serif;
      border-bottom: 2px dashed #c8a87c;
      padding-bottom: 8px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .app-header .subtitle {
      color: #5e4328;
      font-size: clamp(0.75rem, 2vw, 1rem);
      padding: 0 10px;
      font-family: 'Be Vietnam Pro', sans-serif;
      margin-bottom: 5px;
      transition: all 0.3s ease;
    }

    .upload-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 20px;
      background: #efe0cc;
      padding: 15px;
      border-radius: 50px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.1), 0 8px 15px rgba(0,0,0,0.2);
      width: 100%;
      transition: all 0.3s ease;
    }

    .file-label {
      background: #d9b382;
      color: #2d1e0f;
      font-weight: 600;
      padding: clamp(8px, 2vw, 14px) clamp(15px, 3vw, 30px);
      border-radius: 40px;
      cursor: pointer;
      font-size: clamp(0.85rem, 2vw, 1.2rem);
      transition: all 0.25s;
      box-shadow: 0 4px 0 #8b5a2e;
      background: #f3d5a8;
      border: 1px solid #b78c5a;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .file-label:hover {
      background: #fce3b9;
      box-shadow: 0 5px 0 #8b5a2e;
      transform: translateY(-2px);
    }

    .file-label.reload {
      background: #e8c97a;
      box-shadow: 0 4px 0 #8b6d2e;
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 4px 0 #8b6d2e; }
      50% { box-shadow: 0 4px 0 #8b6d2e, 0 0 20px rgba(232, 201, 122, 0.6); }
    }

    input[type="file"] {
      display: none;
    }

    .file-name {
      font-style: italic;
      color: #3b2a17;
      background: #fff6e8;
      padding: 8px 15px;
      border-radius: 30px;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(0.7rem, 1.5vw, 1rem);
      border: 1px solid #c8a87c;
      text-align: center;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .btn-edit, .btn-save, .btn-download {
      font-weight: 600;
      padding: clamp(8px, 2vw, 14px) clamp(12px, 2.5vw, 25px);
      border-radius: 40px;
      cursor: pointer;
      font-size: clamp(0.8rem, 1.8vw, 1.1rem);
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      border: none;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .btn-edit {
      background: #5a8a6a;
      color: white;
      box-shadow: 0 4px 0 #3d5a45;
      border: 1px solid #4a7a5a;
    }

    .btn-edit:hover {
      background: #6a9a7a;
      box-shadow: 0 5px 0 #3d5a45;
      transform: translateY(-2px);
    }

    .btn-edit.active {
      background: #c45a3a;
      box-shadow: 0 4px 0 #8a3a2a;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .btn-save {
      background: #4a7ab5;
      color: white;
      box-shadow: 0 4px 0 #2a4a75;
      border: 1px solid #3a6aa5;
      display: none;
    }

    .btn-save:hover {
      background: #5a8ac5;
      box-shadow: 0 5px 0 #2a4a75;
      transform: translateY(-2px);
    }

    .btn-save.show {
      display: flex;
    }

    .btn-download {
      background: #9b59b6;
      color: white;
      box-shadow: 0 4px 0 #6c3483;
      border: 1px solid #8e44ad;
      display: none;
    }

    .btn-download:hover {
      background: #ab69c6;
      box-shadow: 0 5px 0 #6c3483;
      transform: translateY(-2px);
    }

    .btn-download.show {
      display: flex;
    }

    .btn-download:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: translateY(0);
      box-shadow: 0 4px 0 #6c3483;
    }

    .book-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 5px;
      transition: all 0.3s ease;
    }

    .book {
      display: flex;
      background: #fdf7ed;
      border-radius: 15px 25px 25px 15px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.45), inset 0 0 0 3px #dbbc87, inset 0 0 0 6px #f6ecd9;
      padding: 8px 12px;
      width: 100%;
      max-width: 800px;
      min-height: 400px;
      max-height: 65vh;
      background: #fef7e6;
      position: relative;
      transition: all 0.3s ease;
      margin-bottom: 8px;
    }

    .book-spine {
      width: 28px;
      background: linear-gradient(to right, #755534, #ad8b62, #755534);
      border-radius: 10px 3px 3px 10px;
      margin-right: 10px;
      box-shadow: inset -3px 0 8px rgba(0,0,0,0.4), inset 2px 0 5px rgba(255,255,200,0.5);
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .page-container {
      flex: 1;
      background: #fffcf2;
      border-radius: 3px 15px 15px 3px;
      padding: 15px;
      box-shadow: inset 0 0 15px rgba(160, 120, 60, 0.3);
      display: flex;
      flex-direction: column;
      background: #fff9ef;
      position: relative;
      border-left: 2px solid #e7cfaa;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .song-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      line-height: 1.8;
      color: #2e2412;
      font-family: 'Noto Serif', 'Georgia', 'Times New Roman', serif;
      text-align: center;
      padding: 8px 10px;
      overflow-y: auto;
      overflow-x: hidden;
      background: rgba(255,250,240,0.7);
      border-radius: 6px;
      transition: all 0.3s ease;
      height: 100%;
      -webkit-overflow-scrolling: touch;
      font-feature-settings: "kern" 1;
      font-kerning: normal;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .song-page.editing {
      background: #fffef5;
      border: 2px dashed #c8a87c;
      box-shadow: 0 0 15px rgba(200, 168, 124, 0.5);
      justify-content: flex-start;
      align-items: stretch;
    }

    .song-page .song-title {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700;
      color: #5f3f1c;
      border-bottom: 2px solid #bb9b6e;
      margin-bottom: 12px;
      padding-bottom: 6px;
      text-align: center;
      font-style: italic;
      width: 100%;
      font-family: 'Noto Serif', serif;
    }

    .song-page .song-content {
      white-space: pre-wrap;
      line-height: 2;
      text-align: center;
      width: 100%;
      font-family: 'Noto Serif', serif;
    }

    .song-page textarea {
      width: 100%;
      min-height: 300px;
      height: 100%;
      background: transparent;
      border: none;
      font-family: 'Noto Serif', 'Georgia', serif;
      font-size: clamp(0.95rem, 2vw, 1.3rem);
      line-height: 1.8;
      color: #2e2412;
      resize: vertical;
      outline: none;
      white-space: pre-wrap;
      text-align: left;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-feature-settings: "kern" 1;
      font-kerning: normal;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .edit-hint {
      font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      color: #8b7355;
      text-align: center;
      margin-top: 6px;
      font-style: italic;
      background: #fff9ef;
      padding: 4px 12px;
      border-radius: 20px;
      display: none;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .edit-hint.show {
      display: block;
    }

    .page-navigation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .nav-btn {
      background: #dbbc87;
      border: none;
      font-size: clamp(1.5rem, 3vw, 2rem);
      width: clamp(40px, 8vw, 55px);
      height: clamp(40px, 8vw, 55px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #2e1e0c;
      box-shadow: 0 5px 0 #8b6d4b, 0 6px 12px rgba(0,0,0,0.25);
      transition: all 0.1s ease;
      background: #efd3a5;
      font-weight: bold;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #6b4f32, 0 4px 10px rgba(0,0,0,0.3);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      transform: translateY(0);
      box-shadow: 0 3px 0 #6b4f32;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Nút phóng to - nằm trong navigation */
    .zoom-btn {
      background: #5a8a6a;
      border: none;
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      width: clamp(40px, 8vw, 55px);
      height: clamp(40px, 8vw, 55px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      box-shadow: 0 5px 0 #3d5a45, 0 6px 12px rgba(0,0,0,0.25);
      transition: all 0.1s ease;
      font-weight: bold;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .zoom-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #3d5a45, 0 4px 10px rgba(0,0,0,0.3);
    }

    .zoom-btn:hover {
      background: #6a9a7a;
    }

    .page-indicator {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      background: #efe0cc;
      padding: 6px 18px;
      border-radius: 30px;
      font-weight: bold;
      color: #3a2c18;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.2);
      text-align: center;
      white-space: nowrap;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .empty-message {
      text-align: center;
      color: #ac8e6a;
      font-style: italic;
      padding: 30px;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      font-family: 'Noto Serif', serif;
    }

    .status-text {
      margin-top: 4px;
      color: #5c4329;
      font-weight: 500;
      text-align: center;
      font-size: clamp(0.7rem, 1.5vw, 0.95rem);
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .debug-info {
      font-size: clamp(0.65rem, 1.3vw, 0.85rem);
      color: #8b7355;
      margin-top: 6px;
      text-align: center;
      background: #f5efe0;
      padding: 6px 12px;
      border-radius: 15px;
      max-width: 100%;
      word-break: break-word;
      line-height: 1.3;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .toast {
      position: fixed;
      top: 15px;
      right: 15px;
      left: 15px;
      background: #4a7ab5;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 1000;
      animation: slideIn 0.3s ease-out, fadeOut 0.3s ease-in 2.7s forwards;
      font-weight: 600;
      text-align: center;
      font-size: clamp(0.8rem, 2vw, 1rem);
      max-width: 90%;
      margin: 0 auto;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    @keyframes slideIn {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* ===== CHẾ ĐỘ FULL MÀN HÌNH CHO KHUNG SÁCH ===== */
    .book-wrapper.fullscreen-book {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .book-wrapper.fullscreen-book .book {
      max-width: 95%;
      width: 95%;
      min-height: 70vh;
      max-height: 85vh;
      border-radius: 15px 25px 25px 15px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 0 0 3px #dbbc87, inset 0 0 0 6px #f6ecd9;
    }

    .book-wrapper.fullscreen-book .song-page {
      font-size: clamp(1.3rem, 3vw, 2rem);
      line-height: 2.2;
    }

    .book-wrapper.fullscreen-book .song-page .song-title {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
    }

    .book-wrapper.fullscreen-book .zoom-btn {
      background: #c45a3a;
      box-shadow: 0 5px 0 #8a3a2a, 0 6px 12px rgba(0,0,0,0.3);
    }

    .book-wrapper.fullscreen-book .zoom-btn:hover {
      background: #d45a4a;
    }

    .book-wrapper.fullscreen-book .nav-btn {
      box-shadow: 0 5px 0 #8b6d4b, 0 6px 12px rgba(0,0,0,0.3);
    }

    .book-wrapper.fullscreen-book .status-text,
    .book-wrapper.fullscreen-book .debug-info {
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .book-wrapper.fullscreen-book .debug-info {
      background: rgba(0, 0, 0, 0.3);
      color: #ddd;
    }

    /* Ẩn header và upload area khi fullscreen */
    .app-container.fullscreen-mode .app-header,
    .app-container.fullscreen-mode .upload-area,
    .app-container.fullscreen-mode .song-list-toggle,
    .app-container.fullscreen-mode .song-list-dropdown {
      opacity: 0;
      pointer-events: none;
      height: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Mobile-specific styles */
    @media (max-width: 600px) {
      .app-container {
        border-radius: 30px;
        padding: 15px 10px 20px;
      }

      .song-list-toggle {
        top: 15px;
        left: 12px;
        width: 35px;
        height: 35px;
        font-size: 1rem;
      }

      .song-list-dropdown {
        top: 55px;
        left: 10px;
        width: 280px;
        max-height: 380px;
      }

      .song-list-item {
        padding: 8px 12px;
        gap: 8px;
      }

      .song-list-item .song-order {
        min-width: 24px;
        height: 24px;
        font-size: 0.7rem;
      }

      .song-list-item .song-page-number {
        min-width: 28px;
        height: 24px;
        font-size: 0.7rem;
      }

      .upload-area {
        border-radius: 30px;
        padding: 12px 10px;
        gap: 6px;
      }

      .file-name {
        max-width: 150px;
        font-size: 0.75rem;
        padding: 6px 12px;
      }

      .book {
        flex-direction: column;
        padding: 6px;
        border-radius: 12px 20px 20px 12px;
        min-height: 350px;
        max-height: 55vh;
      }

      .book-spine {
        width: 100%;
        height: 14px;
        margin-right: 0;
        margin-bottom: 6px;
        border-radius: 3px 3px 10px 10px;
      }

      .page-container {
        padding: 12px 8px;
        border-radius: 3px 3px 12px 12px;
        border-left: none;
        border-top: 2px solid #e7cfaa;
      }

      .song-page {
        font-size: 1.05rem;
        line-height: 1.7;
        padding: 6px 8px;
      }

      .btn-edit, .btn-save, .btn-download {
        padding: 8px 15px;
        font-size: 0.85rem;
      }

      .file-label {
        padding: 8px 18px;
        font-size: 0.9rem;
      }

      .page-navigation {
        gap: 10px;
        margin-top: 8px;
      }

      .nav-btn, .zoom-btn {
        width: 38px;
        height: 38px;
        font-size: 1.3rem;
      }

      .toast {
        top: 10px;
        right: 10px;
        left: 10px;
        padding: 10px 15px;
      }

      .book-wrapper.fullscreen-book .book {
        min-height: 60vh;
        max-height: 80vh;
      }
    }

    @media (max-width: 380px) {
      .upload-area {
        flex-direction: column;
        border-radius: 25px;
        padding: 10px;
        gap: 8px;
      }

      .file-name {
        max-width: 100%;
        width: 100%;
      }

      .btn-edit, .btn-save, .btn-download {
        width: 100%;
        justify-content: center;
      }

      .book {
        min-height: 300px;
      }

      .song-page textarea {
        min-height: 250px;
      }

      .song-list-dropdown {
        width: 250px;
        max-height: 320px;
      }
    }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">
  <!-- Nút danh sách bài hát -->
  <button class="song-list-toggle" id="songListToggle" title="Danh sách bài hát">
    ☰
    <span class="badge" id="songCountBadge" style="display:none;">0</span>
  </button>

  <!-- Dropdown danh sách -->
  <div class="song-list-dropdown" id="songListDropdown">
    <div class="song-list-header">
      <span>📋 Danh sách bài hát</span>
      <span class="sort-info">A → Z</span>
    </div>
    <div class="song-list-search">
      <input type="text" id="songSearchInput" placeholder="🔍 Tìm kiếm bài hát...">
    </div>
    <div class="song-list-items" id="songListItems">
      <div class="song-list-empty">Chưa có bài hát nào</div>
    </div>
  </div>
  <div class="song-list-overlay" id="songListOverlay"></div>

  <!-- Header -->
  <div class="app-header">
    <h1>📖 DANH SÁCH BÀI HÁT</h1>
    <p class="subtitle">
      Tải file Word (.docx) – mỗi bài hát phân cách bằng <strong>Page Break (Ctrl+Enter)</strong>
    </p>
  </div>

  <!-- Upload Area -->
  <div class="upload-area">
    <label for="fileUpload" class="file-label" id="fileLabel">
      📄 Chọn file Word
    </label>
    <input type="file" id="fileUpload" accept=".docx, application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    <span id="fileNameDisplay" class="file-name">Chưa chọn file</span>
    <button id="btnEdit" class="btn-edit">✏️ Sửa</button>
    <button id="btnSave" class="btn-save">💾 Lưu</button>
    <button id="btnDownload" class="btn-download">💾 Lưu file</button>
  </div>

  <!-- Book -->
  <div class="book-wrapper" id="bookWrapper">
    <div class="book">
      <div class="book-spine"></div>
      <div class="page-container">
        <div id="songDisplay" class="song-page">
          <div class="empty-message">🎵 Hãy tải lên file Word chứa danh sách bài hát</div>
        </div>
        <div id="editHint" class="edit-hint">
          💡 <strong>Ctrl+Enter</strong> ngắt trang | <strong>Esc</strong> thoát
        </div>
        <div class="page-navigation">
          <button id="prevBtn" class="nav-btn" disabled>←</button>
          <span id="pageIndicator" class="page-indicator">0 / 0</span>
          <button id="nextBtn" class="nav-btn" disabled>→</button>
          <button id="zoomBtn" class="zoom-btn" title="Phóng to">⛶</button>
        </div>
      </div>
    </div>
    <div class="status-text" id="statusMessage"></div>
    <div class="debug-info" id="debugInfo"></div>
  </div>
</div>

<script>
  (function() {
    // ---- Biến trạng thái ----
    let songs = [];
    let currentIndex = 0;
    let isEditing = false;
    let editingPageIndex = 0;
    let currentFileName = '';
    let originalFileName = '';
    let isFullscreen = false;

    // ---- LOCAL STORAGE KEYS ----
    const STORAGE_KEYS = {
      SONGS: 'sach_bai_hat_songs',
      CURRENT_INDEX: 'sach_bai_hat_current_index',
      FILE_NAME: 'sach_bai_hat_file_name',
      ORIGINAL_FILE_NAME: 'sach_bai_hat_original_file_name',
      LAST_UPDATED: 'sach_bai_hat_last_updated'
    };

    // DOM elements
    const appContainer = document.getElementById('appContainer');
    const bookWrapper = document.getElementById('bookWrapper');
    const fileInput = document.getElementById('fileUpload');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const fileLabel = document.getElementById('fileLabel');
    const songDisplayDiv = document.getElementById('songDisplay');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const statusMessage = document.getElementById('statusMessage');
    const debugInfo = document.getElementById('debugInfo');
    const btnEdit = document.getElementById('btnEdit');
    const btnSave = document.getElementById('btnSave');
    const btnDownload = document.getElementById('btnDownload');
    const editHint = document.getElementById('editHint');
    const zoomBtn = document.getElementById('zoomBtn');

    // Song list elements
    const songListToggle = document.getElementById('songListToggle');
    const songListDropdown = document.getElementById('songListDropdown');
    const songListOverlay = document.getElementById('songListOverlay');
    const songListItems = document.getElementById('songListItems');
    const songSearchInput = document.getElementById('songSearchInput');
    const songCountBadge = document.getElementById('songCountBadge');

    // ---- PHÓNG TO / THU NHỎ KHUNG SÁCH ----
    function toggleFullscreen() {
      isFullscreen = !isFullscreen;
      
      if (isFullscreen) {
        // Phóng to khung sách
        bookWrapper.classList.add('fullscreen-book');
        appContainer.classList.add('fullscreen-mode');
        zoomBtn.innerHTML = '✕';
        zoomBtn.title = 'Thu nhỏ';
        document.body.style.overflow = 'hidden';
        
        setTimeout(() => {
          songDisplayDiv.scrollTop = 0;
        }, 100);
        
        showToast('📖 Đã phóng to - Nhấn ✕ để thu nhỏ');
      } else {
        // Thu nhỏ
        bookWrapper.classList.remove('fullscreen-book');
        appContainer.classList.remove('fullscreen-mode');
        zoomBtn.innerHTML = '⛶';
        zoomBtn.title = 'Phóng to';
        document.body.style.overflow = 'auto';
        
        setTimeout(() => {
          songDisplayDiv.scrollTop = 0;
        }, 150);
        
        showToast('🔍 Đã thu nhỏ');
      }
    }

    // ---- Lấy tiêu đề bài hát ----
    function getSongTitle(songContent) {
      if (!songContent) return 'Không có tiêu đề';
      const lines = songContent.split('\n');
      if (lines.length > 0 && lines[0].trim().length > 0 && lines[0].trim().length < 100) {
        return lines[0].trim();
      }
      const firstLine = songContent.split('\n')[0].trim();
      return firstLine.substring(0, 50) + (firstLine.length > 50 ? '...' : '');
    }

    function getSongPreview(songContent, maxLength = 40) {
      if (!songContent) return '';
      const lines = songContent.split('\n');
      const previewLine = lines.length > 1 ? lines[1].trim() : '';
      if (previewLine.length > maxLength) {
        return previewLine.substring(0, maxLength) + '...';
      }
      return previewLine;
    }

    function getSortedSongs(filterText = '') {
      let songList = songs.map((song, index) => ({
        originalIndex: index,
        title: getSongTitle(song),
        preview: getSongPreview(song),
        content: song
      }));

      if (filterText.trim()) {
        const searchLower = filterText.toLowerCase().trim();
        songList = songList.filter(song => 
          song.title.toLowerCase().includes(searchLower) ||
          song.preview.toLowerCase().includes(searchLower)
        );
      }

      songList.sort((a, b) => {
        return a.title.localeCompare(b.title, 'vi', { sensitivity: 'base' });
      });

      return songList;
    }

    function renderSongList(filterText = '') {
      const sortedSongs = getSortedSongs(filterText);

      if (sortedSongs.length === 0) {
        songListItems.innerHTML = '<div class="song-list-empty">Không tìm thấy bài hát</div>';
        return;
      }

      songListItems.innerHTML = sortedSongs.map((song, displayIndex) => {
        const isActive = song.originalIndex === currentIndex;
        const pageNumber = song.originalIndex + 1;
        
        return `
          <div class="song-list-item ${isActive ? 'active' : ''}" data-index="${song.originalIndex}">
            <span class="song-order">${displayIndex + 1}</span>
            <div class="song-info">
              <div class="song-name">${escapeHtml(song.title)}</div>
              ${song.preview ? `<div class="song-preview">${escapeHtml(song.preview)}</div>` : ''}
            </div>
            <span class="song-page-number">Tr.${pageNumber}</span>
          </div>
        `;
      }).join('');

      songListItems.querySelectorAll('.song-list-item').forEach(item => {
        item.addEventListener('click', function() {
          const index = parseInt(this.dataset.index);
          if (!isNaN(index) && index >= 0 && index < songs.length) {
            goToPage(index);
            closeSongList();
          }
        });
      });
    }

    function toggleSongList() {
      if (songListDropdown.classList.contains('show')) {
        closeSongList();
      } else {
        openSongList();
      }
    }

    function openSongList() {
      songListDropdown.classList.add('show');
      songListOverlay.classList.add('show');
      songSearchInput.value = '';
      renderSongList();
      songSearchInput.focus();
      updateSongCountBadge();
    }

    function closeSongList() {
      songListDropdown.classList.remove('show');
      songListOverlay.classList.remove('show');
    }

    function updateSongCountBadge() {
      if (songs.length > 0) {
        songCountBadge.style.display = 'flex';
        songCountBadge.textContent = songs.length;
      } else {
        songCountBadge.style.display = 'none';
      }
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEYS.SONGS, JSON.stringify(songs));
        localStorage.setItem(STORAGE_KEYS.CURRENT_INDEX, currentIndex.toString());
        localStorage.setItem(STORAGE_KEYS.FILE_NAME, currentFileName);
        localStorage.setItem(STORAGE_KEYS.ORIGINAL_FILE_NAME, originalFileName);
        localStorage.setItem(STORAGE_KEYS.LAST_UPDATED, new Date().toISOString());
      } catch (error) {
        console.error('❌ Lỗi lưu localStorage:', error);
      }
    }

    function loadFromLocalStorage() {
      try {
        const savedSongs = localStorage.getItem(STORAGE_KEYS.SONGS);
        const savedIndex = localStorage.getItem(STORAGE_KEYS.CURRENT_INDEX);
        const savedFileName = localStorage.getItem(STORAGE_KEYS.FILE_NAME);
        const savedOriginalFileName = localStorage.getItem(STORAGE_KEYS.ORIGINAL_FILE_NAME);

        if (savedSongs) {
          songs = JSON.parse(savedSongs);
          currentIndex = savedIndex ? parseInt(savedIndex) : 0;
          currentFileName = savedFileName || '';
          originalFileName = savedOriginalFileName || '';
          return true;
        }
        return false;
      } catch (error) {
        return false;
      }
    }

    function clearLocalStorage() {
      try {
        Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
      } catch (error) {}
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, duration = 3000) {
      const oldToast = document.querySelector('.toast');
      if (oldToast) oldToast.remove();
      
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, duration);
    }

    function scrollToTop() {
      setTimeout(() => {
        songDisplayDiv.scrollTop = 0;
      }, 50);
    }

    function normalizePageText(text) {
      let lines = text.split('\n');
      lines = lines.map(line => line.trim());
      
      while (lines.length > 0 && lines[0] === '') lines.shift();
      while (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();
      
      const cleanedLines = [];
      let prevEmpty = false;
      
      for (let line of lines) {
        if (line === '') {
          if (!prevEmpty) {
            cleanedLines.push('');
            prevEmpty = true;
          }
        } else {
          cleanedLines.push(line);
          prevEmpty = false;
        }
      }
      
      return cleanedLines.join('\n');
    }

    function extractTextWithPageBreaks(xmlString) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
      
      const pages = [];
      let currentPageText = '';
      let pageBreakCount = 0;
      
      function processNode(node) {
        if (node.nodeType === 3) return node.nodeValue || '';
        if (node.nodeType !== 1) return '';
        
        const tagName = node.localName || node.nodeName;
        let text = '';
        
        if (tagName === 't') {
          text = node.textContent || '';
        } else if (tagName === 'br') {
          const typeAttr = node.getAttribute('w:type') || node.getAttribute('type');
          if (typeAttr === 'page') {
            pageBreakCount++;
            if (currentPageText.trim()) pages.push(currentPageText.trim());
            currentPageText = '';
            return '[PAGE_BREAK]';
          } else {
            return '\n';
          }
        } else if (tagName === 'tab') {
          return '\t';
        } else if (tagName === 'p') {
          let paraText = '';
          for (let child of node.childNodes) {
            const result = processNode(child);
            if (result === '[PAGE_BREAK]') {
              paraText = '';
            } else {
              paraText += result;
            }
          }
          if (paraText.trim()) {
            currentPageText += (currentPageText ? '\n' : '') + paraText.trim();
          }
          return '';
        } else {
          for (let child of node.childNodes) {
            const result = processNode(child);
            if (result !== '[PAGE_BREAK]') text += result;
          }
          return text;
        }
        return text;
      }
      
      const body = xmlDoc.getElementsByTagNameNS('*', 'body')[0] || 
                   xmlDoc.getElementsByTagName('body')[0];
      
      if (!body) throw new Error('Không tìm thấy body');
      
      for (let child of body.childNodes) {
        if (child.nodeType === 1) processNode(child);
      }
      
      if (currentPageText.trim()) pages.push(currentPageText.trim());
      
      return { pages, pageBreakCount };
    }

    async function parseDocxFile(arrayBuffer) {
      const zip = await JSZip.loadAsync(arrayBuffer);
      const docXmlFile = zip.file('word/document.xml');
      if (!docXmlFile) throw new Error('Không tìm thấy word/document.xml');
      
      const xmlString = await docXmlFile.async('text');
      const { pages, pageBreakCount } = extractTextWithPageBreaks(xmlString);
      
      const processedSongs = pages
        .map(page => normalizePageText(page))
        .filter(page => page.length > 0);
      
      return { songs: processedSongs, pageBreakCount };
    }

    async function createDocxBlob() {
      let xmlContent = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <w:document xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas"
                  xmlns:mo="http://schemas.microsoft.com/office/mac/office/2008/main"
                  xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"
                  xmlns:mv="urn:schemas-microsoft-com:mac:vml"
                  xmlns:o="urn:schemas-microsoft-com:office:office"
                  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
                  xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"
                  xmlns:v="urn:schemas-microsoft-com:vml"
                  xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
                  xmlns:w10="urn:schemas-microsoft-com:office:word"
                  xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
                  xmlns:wne="http://schemas.microsoft.com/office/word/2006/wordml">
        <w:body>`;

      for (let i = 0; i < songs.length; i++) {
        const songText = songs[i];
        const lines = songText.split('\n');

        for (let line of lines) {
          if (line.trim()) {
            xmlContent += `
          <w:p>
            <w:pPr>
              <w:jc w:val="center"/>
            </w:pPr>
            <w:r>
              <w:rPr>
                <w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/>
                <w:sz w:val="28"/>
              </w:rPr>
              <w:t xml:space="preserve">${escapeXml(line)}</w:t>
            </w:r>
          </w:p>`;
          }
        }

        if (i < songs.length - 1) {
          xmlContent += `
          <w:p>
            <w:r>
              <w:br w:type="page"/>
            </w:r>
          </w:p>`;
        }
      }

      xmlContent += `
        </w:body>
      </w:document>`;

      const zip = new JSZip();

      zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
        <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
        <Default Extension="xml" ContentType="application/xml"/>
        <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
      </Types>`);

      const relsFolder = zip.folder('_rels');
      relsFolder.file('.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
        <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
      </Relationships>`);

      const wordFolder = zip.folder('word');
      wordFolder.file('document.xml', xmlContent);
      
      const blob = await zip.generateAsync({ 
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        compression: 'DEFLATE',
        compressionOptions: { level: 6 }
      });

      return blob;
    }

    async function downloadDocxFile() {
      if (songs.length === 0) {
        showToast('⚠️ Không có bài hát nào để lưu');
        return;
      }

      try {
        btnDownload.disabled = true;
        btnDownload.textContent = '⏳ Đang tạo...';
        statusMessage.textContent = '⏳ Đang chuẩn bị file Word...';

        const blob = await createDocxBlob();

        let downloadFileName = 'danh_sach_bai_hat.docx';
        if (originalFileName) {
          const cleanName = originalFileName.replace(/\.docx$/i, '').replace(/_da_chinh_sua$/, '');
          downloadFileName = cleanName + '_da_chinh_sua.docx';
        }

        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = downloadFileName;
        link.style.display = 'none';
        
        document.body.appendChild(link);
        link.click();
        
        setTimeout(() => {
          document.body.removeChild(link);
          window.URL.revokeObjectURL(url);
        }, 200);

        showToast(`✅ Đã lưu: ${downloadFileName}`);
        statusMessage.textContent = `✅ Đã lưu "${downloadFileName}"`;
        debugInfo.textContent = `📥 ${downloadFileName} | ${songs.length} bài | ${(blob.size / 1024).toFixed(1)} KB`;

      } catch (error) {
        console.error('❌ Lỗi:', error);
        showToast('❌ Lỗi: ' + error.message);
      } finally {
        btnDownload.disabled = false;
        btnDownload.textContent = '💾 Lưu file';
        setTimeout(() => { if (statusMessage.textContent.includes('Đã lưu')) statusMessage.textContent = ''; }, 4000);
      }
    }

    function escapeXml(text) {
      if (!text) return '';
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
    }

    function resetToInitialState() {
      songs = [];
      currentIndex = 0;
      editingPageIndex = 0;
      currentFileName = '';
      originalFileName = '';
      isEditing = false;
      
      fileInput.value = '';
      fileNameDisplay.textContent = 'Chưa chọn file';
      fileLabel.classList.remove('reload');
      fileLabel.innerHTML = '📄 Chọn file Word';
      
      songDisplayDiv.innerHTML = `<div class="empty-message">🎵 Hãy tải lên file Word chứa danh sách bài hát</div>`;
      songDisplayDiv.classList.remove('editing');
      
      btnEdit.classList.remove('active');
      btnEdit.textContent = '✏️ Sửa';
      btnSave.classList.remove('show');
      btnDownload.classList.remove('show');
      editHint.classList.remove('show');
      
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      pageIndicator.textContent = '0 / 0';
      
      statusMessage.textContent = '';
      debugInfo.textContent = '📝 Sẵn sàng - Dữ liệu lưu tự động';
      
      updateSongCountBadge();
      clearLocalStorage();
    }

    function updateFileNameDisplay(fileName) {
      if (fileName) {
        currentFileName = fileName;
        originalFileName = fileName;
        fileNameDisplay.textContent = fileName;
        fileLabel.classList.add('reload');
        fileLabel.innerHTML = '📄 Tải file mới';
        btnDownload.classList.add('show');
      } else {
        currentFileName = '';
        originalFileName = '';
        fileNameDisplay.textContent = 'Chưa chọn file';
        fileLabel.classList.remove('reload');
        fileLabel.innerHTML = '📄 Chọn file Word';
        btnDownload.classList.remove('show');
      }
    }

    function renderSongView(index) {
      if (!songs.length || index < 0 || index >= songs.length) {
        songDisplayDiv.innerHTML = `<div class="empty-message">🎼 Không có bài hát nào</div>`;
        songDisplayDiv.classList.remove('editing');
        updateNavigationState();
        return;
      }

      const songContent = songs[index];
      const lines = songContent.split('\n');
      let title = '';
      let content = songContent;
      
      if (lines.length > 0 && lines[0].length > 0 && lines[0].length < 100) {
        title = lines[0];
        content = lines.slice(1).join('\n').trim();
      }
      
      if (!content) {
        content = songContent;
        title = '';
      }

      const titleHtml = title ? `<div class="song-title">${escapeHtml(title)}</div>` : '';
      const contentHtml = `<div class="song-content">${escapeHtml(content)}</div>`;
      
      songDisplayDiv.innerHTML = titleHtml + contentHtml;
      songDisplayDiv.classList.remove('editing');
      songDisplayDiv.style.overflowY = 'auto';
      
      scrollToTop();
      updateNavigationState();
    }

    function renderSongEdit(index) {
      if (!songs.length || index < 0 || index >= songs.length) {
        songDisplayDiv.innerHTML = `<div class="empty-message">🎼 Không có bài hát nào</div>`;
        songDisplayDiv.classList.remove('editing');
        updateNavigationState();
        return;
      }

      editingPageIndex = index;
      const songContent = songs[index];
      const textareaHtml = `<textarea id="editTextarea" placeholder="Nhập nội dung bài hát...&#10;&#10;Nhấn Ctrl+Enter để ngắt trang thủ công">${escapeHtml(songContent)}</textarea>`;
      
      songDisplayDiv.innerHTML = textareaHtml;
      songDisplayDiv.classList.add('editing');
      updateNavigationState();
      
      const textarea = document.getElementById('editTextarea');
      if (textarea) {
        scrollToTop();
        textarea.focus();
        textarea.selectionStart = textarea.value.length;
        textarea.selectionEnd = textarea.value.length;
      }
    }

    function setupEditListeners() {
      const textarea = document.getElementById('editTextarea');
      if (!textarea) return;
      
      textarea.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
          e.preventDefault();
          const start = this.selectionStart;
          const value = this.value;
          const beforeCursor = value.substring(0, start);
          const afterCursor = value.substring(this.selectionEnd);
          
          this.value = beforeCursor + '\n---PAGE_BREAK---\n' + afterCursor;
          const newPosition = start + '\n---PAGE_BREAK---\n'.length;
          this.selectionStart = newPosition;
          this.selectionEnd = newPosition;
          this.dispatchEvent(new Event('input'));
          showToast('✅ Đã thêm ngắt trang');
        }
        
        if (e.key === 'Escape') {
          e.preventDefault();
          cancelEdit();
        }
        
        if (e.ctrlKey && e.key === 's') {
          e.preventDefault();
          saveEdit();
        }
      });
      
      textarea.addEventListener('input', function() {
        statusMessage.textContent = '📝 Đang chỉnh sửa...';
      });
    }

    function startEdit() {
      if (songs.length === 0) {
        showToast('⚠️ Chưa có bài hát nào');
        return;
      }
      
      isEditing = true;
      editingPageIndex = currentIndex;
      
      btnEdit.classList.add('active');
      btnEdit.textContent = '✏️ Đang sửa...';
      btnSave.classList.add('show');
      btnDownload.classList.remove('show');
      editHint.classList.add('show');
      
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      
      renderSongEdit(currentIndex);
      setupEditListeners();
      
      statusMessage.textContent = '📝 Ctrl+Enter: ngắt trang | Ctrl+S: lưu | Esc: hủy';
    }

    function saveEdit() {
      if (!isEditing) return;
      
      const textarea = document.getElementById('editTextarea');
      if (!textarea) return;
      
      const editedParts = textarea.value.split('---PAGE_BREAK---');
      const editedSongs = editedParts
        .map(part => normalizePageText(part))
        .filter(part => part.length > 0);
      
      if (editedSongs.length === 0) {
        showToast('⚠️ Nội dung trống');
        return;
      }
      
      songs.splice(editingPageIndex, 1, ...editedSongs);
      currentIndex = editingPageIndex;
      
      exitEditMode();
      saveToLocalStorage();
      renderSongView(currentIndex);
      updateSongCountBadge();
      
      statusMessage.textContent = `✅ Đã lưu! ${songs.length} bài - Trang ${currentIndex + 1}`;
      debugInfo.textContent = `🎯 ${songs.length} bài | 💾 Đã lưu local`;
      showToast(`✅ Đã lưu! ${songs.length} bài hát`);
      
      btnDownload.classList.add('show');
      setTimeout(() => { statusMessage.textContent = ''; }, 3000);
    }

    function cancelEdit() {
      if (!isEditing) return;
      exitEditMode();
      renderSongView(currentIndex);
      statusMessage.textContent = '❌ Đã hủy';
      btnDownload.classList.add('show');
      setTimeout(() => { statusMessage.textContent = ''; }, 2000);
    }

    function exitEditMode() {
      isEditing = false;
      btnEdit.classList.remove('active');
      btnEdit.textContent = '✏️ Sửa';
      btnSave.classList.remove('show');
      editHint.classList.remove('show');
      songDisplayDiv.classList.remove('editing');
      updateNavigationState();
    }

    function updateNavigationState() {
      const total = songs.length;
      
      if (total === 0) {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        pageIndicator.textContent = `0 / 0`;
        currentIndex = 0;
        return;
      }

      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= total) currentIndex = total - 1;

      if (isEditing) {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      } else {
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = (currentIndex === total - 1);
      }
      
      pageIndicator.textContent = `${currentIndex + 1} / ${total}`;
    }

    function goToPage(index) {
      if (isEditing) {
        if (confirm('Lưu thay đổi trước khi chuyển trang?')) {
          saveEdit();
        } else {
          cancelEdit();
        }
        return;
      }
      
      if (!songs.length) {
        currentIndex = 0;
        renderSongView(0);
        return;
      }
      
      if (index < 0) index = 0;
      if (index >= songs.length) index = songs.length - 1;
      
      currentIndex = index;
      saveToLocalStorage();
      renderSongView(currentIndex);
      updateSongCountBadge();
    }

    function onPrev() {
      if (songs.length && currentIndex > 0 && !isEditing) goToPage(currentIndex - 1);
    }

    function onNext() {
      if (songs.length && currentIndex < songs.length - 1 && !isEditing) goToPage(currentIndex + 1);
    }

    async function processNewFile(file) {
      try {
        resetToInitialState();
        statusMessage.textContent = '⏳ Đang xử lý...';
        
        const arrayBuffer = await file.arrayBuffer();
        const result = await parseDocxFile(arrayBuffer);
        songs = [...result.songs];
        
        updateFileNameDisplay(file.name);
        saveToLocalStorage();
        updateSongCountBadge();
        
        if (songs.length === 0) {
          statusMessage.textContent = '⚠️ Không có nội dung';
          songDisplayDiv.innerHTML = `<div class="empty-message">📄 File trống</div>`;
        } else {
          statusMessage.textContent = `✅ ${songs.length} bài hát (đã lưu)`;
          debugInfo.textContent = `🎯 ${songs.length} bài | 💾 Đã lưu`;
        }
        
        currentIndex = 0;
        renderSongView(0);
        showToast(`✅ Đã tải! ${songs.length} bài hát`);
        
      } catch (error) {
        console.error('❌ Lỗi:', error);
        resetToInitialState();
        showToast('❌ ' + error.message);
      }
    }

    function handleFileSelect(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.docx')) {
        showToast('⚠️ Chỉ hỗ trợ .docx');
        fileInput.value = '';
        return;
      }
      
      if (isEditing) {
        if (confirm('Đang chỉnh sửa. Tải file mới sẽ mất thay đổi. Tiếp tục?')) {
          // OK
        } else {
          fileInput.value = '';
          return;
        }
      }
      
      processNewFile(file);
    }

    function restoreState() {
      if (loadFromLocalStorage() && songs.length > 0) {
        updateFileNameDisplay(currentFileName);
        renderSongView(currentIndex);
        updateSongCountBadge();
        
        const lastUpdated = localStorage.getItem(STORAGE_KEYS.LAST_UPDATED);
        const updateTime = lastUpdated ? new Date(lastUpdated).toLocaleString('vi-VN') : '';
        
        debugInfo.textContent = `💾 ${songs.length} bài | Cập nhật: ${updateTime}`;
        showToast(`📂 Đã khôi phục ${songs.length} bài hát`);
      } else {
        debugInfo.textContent = '📝 Sẵn sàng - Dữ liệu lưu tự động';
      }
    }

    // ---- Sự kiện ----
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) handleFileSelect(e.target.files[0]);
    });

    document.addEventListener('dragover', (e) => { e.preventDefault(); });
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
    });

    zoomBtn.addEventListener('click', toggleFullscreen);

    songListToggle.addEventListener('click', toggleSongList);
    songListOverlay.addEventListener('click', closeSongList);

    songSearchInput.addEventListener('input', function() {
      renderSongList(this.value);
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (songListDropdown.classList.contains('show')) {
          closeSongList();
        } else if (isFullscreen) {
          toggleFullscreen();
        }
      }
      if (e.key === 'f' && e.ctrlKey) {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    btnEdit.addEventListener('click', () => {
      if (isEditing) {
        if (confirm('Lưu thay đổi?')) saveEdit();
        else cancelEdit();
      } else {
        startEdit();
      }
    });

    btnSave.addEventListener('click', saveEdit);
    btnDownload.addEventListener('click', downloadDocxFile);
    prevBtn.addEventListener('click', onPrev);
    nextBtn.addEventListener('click', onNext);

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'o') { e.preventDefault(); fileInput.click(); }
      if (e.ctrlKey && e.key === 's' && !isEditing) { e.preventDefault(); downloadDocxFile(); }
      if (e.ctrlKey && e.key === 'e' && !isEditing) { e.preventDefault(); startEdit(); }
      if (e.ctrlKey && e.key === 'l') { e.preventDefault(); toggleSongList(); }
      
      if (!isEditing) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); if (!prevBtn.disabled) onPrev(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); if (!nextBtn.disabled) onNext(); }
      }
    });

    window.addEventListener('beforeunload', () => {
      if (songs.length > 0 && !isEditing) saveToLocalStorage();
    });

    restoreState();
    
  })();
</script>
</body>
