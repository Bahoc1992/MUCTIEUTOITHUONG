<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu Tối Thượng Trong Ngày</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&display=swap');
        body { font-family: 'Montserrat', sans-serif; background: #0a0a0a; color: #e5e7eb; overflow-x: hidden; }
        
        .app-icon-3d {
            background: linear-gradient(180deg, #fceabb 0%, #d4af37 100%);
            color: #4a3500;
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 6px 0 #9c8026, 0 10px 15px rgba(0,0,0,0.5);
            text-transform: uppercase;
            font-weight: 900;
            display: inline-block;
            text-align: center;
            line-height: 1.2;
            font-size: 1.1rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.4s ease;
        }

        .glass-card:hover {
            border-color: #d4af37;
            transform: scale(1.01);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .center-image {
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3));
            max-width: 220px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12">

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col items-center mb-10 mt-4">
            <div class="app-icon-3d md:text-3xl tracking-widest">
                Mục Tiêu Tối Thượng Trong Ngày
            </div>
            <p class="mt-4 text-red-500 font-bold text-sm md:text-xl animate-pulse tracking-wide italic text-center px-2">
                "Mau chóng về Nhà, không kịp rồi!"
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
            <div id="left-goals" class="space-y-4"></div>

            <div class="flex justify-center order-first lg:order-none my-4 lg:my-0">
                <img src="https://lh3.googleusercontent.com/d/1akUspq5E7fqA-uuJIMxDemm3Ji4iMkX2" 
                     alt="[Hình ảnh luân xa]" class="center-image">
            </div>

            <div id="right-goals" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const goals = [
            { title: "Quán Âm 3h", icon: "volume-2", note: "bổ sung năng lượng trục sống lưng, xóa nghiệp để không bị nghiệp phủ" },
            { title: "Mật Niệm 24h", icon: "brain", note: "để nghiệp không xâm nhập, đầu óc không dính mắc" },
            { title: "Giữ chặt Ngũ Giới", icon: "shield-check", note: "dính ngũ giới sẽ bị luân hồi" },
            { title: "Giữ Tinh Khí Thần", icon: "sprout", note: "cốt lõi của trục sống lưng" },
            { title: "Thông 12 kinh, 3 chính kinh", icon: "waves", note: "" },
            { title: "Giải tắc nghẽn cơ, huyệt", icon: "unlock", note: "" },
            { title: "Cân bằng âm dương", icon: "scale", note: "" },
            { title: "Cân bằng ngũ tạng", icon: "heart-pulse", note: "" },
            { title: "Thu nhập thụ động", icon: "trending-up", note: "xây dựng lộ trình để tiến tới, 1 ngách chuyên biệt, ít hao tổn tinh thần" }
        ];

        const left = document.getElementById('left-goals');
        const right = document.getElementById('right-goals');

        goals.forEach((g, i) => {
            const card = `
                <div class="glass-card p-4 rounded-xl">
                    <div class="flex items-center gap-3 mb-2">
                        <i data-lucide="${g.icon}" class="text-[#d4af37] w-6 h-6 flex-shrink-0"></i>
                        <h2 class="text-lg md:text-2xl font-bold text-white">${(i+1).toString().padStart(2, '0')}</h2>
                    </div>
                    <p class="text-base font-semibold text-[#d4af37]">${g.title}</p>
                    ${g.note ? `<p class="text-[11px] md:text-xs text-gray-400 mt-2 italic leading-relaxed">"${g.note}"</p>` : ''}
                </div>
            `;
            i < 4 ? left.innerHTML += card : right.innerHTML += card;
        });

        lucide.createIcons();
    </script>
</body>
</html>
